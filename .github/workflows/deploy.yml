name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/mundimasajes

            php artisan down --retry=15 || true
            trap 'php artisan up' EXIT

            git fetch origin main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            npm ci
            npm run build

            php artisan migrate --force

            # The demo is public, so each deploy restores the frozen content.
            # Runs as www-data because it rewrites images under storage/app/public.
            sudo -u www-data php artisan storage:link --force
            sudo -u www-data php artisan demo:refresh --force

            # www-data serves the app, so it must own the caches it reads and writes
            sudo -u www-data php artisan optimize:clear
            sudo -u www-data php artisan optimize
            sudo systemctl reload php8.4-fpm
